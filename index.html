<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>APEX Racing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#05070c;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:#fff;
    -webkit-user-select:none;user-select:none}
  canvas#c{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
  #hud.show{opacity:1}

  .speedo{position:absolute;right:34px;bottom:26px;text-align:right;
    text-shadow:0 3px 18px rgba(0,0,0,.85)}
  .speedo #speedVal{font-size:76px;font-weight:800;line-height:.85;
    font-variant-numeric:tabular-nums;letter-spacing:-3px}
  .speedo .unit{font-size:15px;font-weight:600;letter-spacing:5px;opacity:.65}

  .topleft{position:absolute;left:26px;top:22px;text-shadow:0 2px 12px rgba(0,0,0,.9)}
  .topleft .lap{font-size:14px;letter-spacing:3px;opacity:.7;font-weight:600}
  .topleft .lap b{font-size:22px;opacity:1;color:#fff;font-weight:800}
  .topleft .time{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .topleft .best{font-size:13px;letter-spacing:2px;opacity:.6;font-weight:600;margin-top:2px}

  .topright{position:absolute;right:30px;top:22px;text-align:right;text-shadow:0 2px 12px rgba(0,0,0,.9)}
  .topright .pos{font-size:46px;font-weight:800;letter-spacing:-2px}
  .topright .of{font-size:13px;letter-spacing:3px;opacity:.6;font-weight:600}

  #minimap{position:absolute;left:24px;bottom:24px;width:170px;height:170px;
    background:rgba(8,12,20,.45);border:1px solid rgba(255,255,255,.13);
    border-radius:14px;backdrop-filter:blur(8px)}

  #cd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:150px;font-weight:900;opacity:0;transition:opacity .2s;
    text-shadow:0 0 60px rgba(255,120,40,.8);letter-spacing:-6px}
  #cd.show{opacity:1}

  #msg{position:absolute;left:50%;top:16%;transform:translateX(-50%);
    font-size:34px;font-weight:800;letter-spacing:2px;opacity:0;transition:opacity .4s;
    text-shadow:0 4px 30px rgba(0,0,0,.9);white-space:nowrap}
  #msg.show{opacity:1}

  /* ---------- MENU ---------- */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:18px;padding:26px;
    background:radial-gradient(ellipse at 50% 0%,#14203a 0%,#05070c 65%);
    overflow-y:auto;opacity:0;pointer-events:none;transition:opacity .45s;z-index:20}
  .overlay.show{opacity:1;pointer-events:auto}

  h1{font-size:min(11vw,64px);font-weight:900;letter-spacing:-4px;line-height:.9;
    background:linear-gradient(180deg,#fff 20%,#7d8ba8 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  h1 span{background:linear-gradient(180deg,#ff9a3c,#ff3d3d);
    -webkit-background-clip:text;background-clip:text;color:transparent}

  .section{width:100%;max-width:1180px}
  .section h2{font-size:12px;letter-spacing:5px;opacity:.45;font-weight:700;
    margin-bottom:10px;text-align:center}

  .cards{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .card{flex:1 1 195px;max-width:225px;background:rgba(255,255,255,.045);
    border:1.5px solid rgba(255,255,255,.09);border-radius:15px;padding:12px 13px;
    cursor:pointer;transition:.22s;position:relative;overflow:hidden}
  .card:hover{background:rgba(255,255,255,.09);transform:translateY(-3px)}
  .card.sel{border-color:#ff8a3c;background:rgba(255,138,60,.13);
    box-shadow:0 0 0 1px rgba(255,138,60,.4),0 10px 34px -10px rgba(255,138,60,.6)}
  .card .nm{font-size:15px;font-weight:800;letter-spacing:-.3px}
  .card .cl{font-size:9px;letter-spacing:2.5px;opacity:.5;font-weight:700;margin-top:2px}
  .card .ds{font-size:10px;opacity:.55;margin-top:6px;line-height:1.35;min-height:36px}
  .bars{margin-top:8px;display:flex;flex-direction:column;gap:3px}
  .bar{display:flex;align-items:center;gap:6px;font-size:8px;letter-spacing:1.2px;opacity:.75}
  .bar i{font-style:normal;width:36px;opacity:.7}
  .bar u{flex:1;height:4px;background:rgba(255,255,255,.1);border-radius:3px;
    overflow:hidden;text-decoration:none}
  .bar u b{display:block;height:100%;border-radius:3px;
    background:linear-gradient(90deg,#ff6a2b,#ffc23c)}

  button#startBtn{margin-top:8px;padding:15px 62px;font-size:16px;font-weight:800;
    letter-spacing:4px;border:none;border-radius:50px;cursor:pointer;color:#180b02;
    background:linear-gradient(135deg,#ffb43c,#ff5a1f);transition:.22s;
    box-shadow:0 12px 36px -8px rgba(255,110,40,.75)}
  button#startBtn:hover{transform:scale(1.05);box-shadow:0 16px 44px -8px rgba(255,110,40,.95)}

  .hint{font-size:11px;letter-spacing:2px;opacity:.35;text-align:center;line-height:1.7}

  /* ---------- RESULTS ---------- */
  #results .panel{background:rgba(12,18,30,.9);border:1px solid rgba(255,255,255,.11);
    border-radius:20px;padding:30px 44px;text-align:center;backdrop-filter:blur(16px)}
  #results h2{font-size:36px;font-weight:900;letter-spacing:-1px;margin-bottom:16px}
  #results .row{display:flex;justify-content:space-between;gap:44px;
    font-size:15px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07)}
  #results .row b{font-weight:800}
  #results .btns{display:flex;gap:12px;margin-top:24px;justify-content:center}
  #results button{padding:12px 30px;font-size:12px;font-weight:800;letter-spacing:2.5px;
    border-radius:40px;border:1.5px solid rgba(255,255,255,.22);background:transparent;
    color:#fff;cursor:pointer;transition:.2s}
  #results button:hover{background:rgba(255,255,255,.12)}
  #results button.primary{background:linear-gradient(135deg,#ffb43c,#ff5a1f);
    border-color:transparent;color:#180b02}

  /* ---------- TOUCH ---------- */
  #touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:15}
  #touch.show{display:block}
  .tbtn{position:absolute;bottom:32px;width:88px;height:88px;border-radius:50%;
    background:rgba(255,255,255,.11);border:2px solid rgba(255,255,255,.22);
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;
    pointer-events:auto;backdrop-filter:blur(6px)}
  .tbtn:active{background:rgba(255,255,255,.3)}
  #tL{left:26px}#tR{left:130px}#tB{right:130px;font-size:16px}#tA{right:26px;font-size:16px}

  #loading{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:#05070c;z-index:40;font-size:13px;letter-spacing:5px;font-weight:700;opacity:.7}
  #loading.show{display:flex}
</style>
</head>

</div>

<div id="results" class="overlay">

      <button id="againBtn" class="primary">RACE AGAIN</button>

</div>

    }

  {

            [-100,148],[-200,140],[-208,50],[-208,-50]],
    theme:{
      skyTop:'#03040c', skyMid:'#0a0f26', skyBottom:'#1a1140', sunGlow:'rgba(120,80,255,0.35)',

      sunColor:0x8fa4ff, sunInt:0.9, sunPos:[-160,240,120],

    }

/* ============================================================
   RENDERER / SCENE
============================================================ */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.3, 4000);

const worldGroup  = new THREE.Group(); scene.add(worldGroup);
const racersGroup = new THREE.Group(); scene.add(racersGroup);

/* ---------- lighting ---------- */
const sun = new THREE.DirectionalLight(0xffffff, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 1;
sun.shadow.camera.far  = 700;
sun.shadow.camera.left = -95; sun.shadow.camera.right = 95;
sun.shadow.camera.top  =  95; sun.shadow.camera.bottom = -95;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.04;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
scene.add(hemi);

/* ---------- sky dome ---------- */
const skyMat = new THREE.ShaderMaterial({
  uniforms:{
    top:{value:new THREE.Color()}, mid:{value:new THREE.Color()},
    bot:{value:new THREE.Color()}, off:{value:0.25}
  },
  vertexShader:`varying vec3 vP;
    void main(){ vP = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform float off;
    varying vec3 vP;
    void main(){
      float h = normalize(vP).y;
      vec3 c = h > off ? mix(mid, top, smoothstep(off, 1.0, h))
                       : mix(bot, mid, smoothstep(-0.35, off, h));
      gl_FragColor = vec4(c, 1.0);
    }`,
  side: THREE.BackSide, depthWrite:false, fog:false
});
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(2200, 32, 20), skyMat);
scene.add(skyDome);

/* ============================================================
   TEXTURE FACTORY
============================================================ */
function makeAsphalt(){
  const c = document.createElement('canvas'); c.width = 256; c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = '#2b2b30'; x.fillRect(0,0,256,512);
  const img = x.getImageData(0,0,256,512), d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*30;
    d[i]+=n; d[i+1]+=n; d[i+2]+=n;
  }
  x.putImageData(img,0,0);
  for (let i=0;i<40;i++){
    x.fillStyle = `rgba(0,0,0,${Math.random()*0.09})`;
    x.beginPath();
    x.ellipse(Math.random()*256, Math.random()*512, 12+Math.random()*40, 12+Math.random()*40, 0, 0, 7);
    x.fill();
  }
  x.fillStyle = 'rgba(235,235,235,0.85)';
  x.fillRect(9, 0, 5, 512);
  x.fillRect(242, 0, 5, 512);
  x.fillStyle = 'rgba(230,230,230,0.7)';
  for (let y=0; y<512; y+=256) x.fillRect(125, y, 6, 130);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

function makeGroundTex(base, spec){
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0,0,512,512);
  for (let i=0;i<7000;i++){
    x.fillStyle = `rgba(${spec},${Math.random()*0.16})`;
    x.fillRect(Math.random()*512, Math.random()*512, 1+Math.random()*3, 1+Math.random()*3);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(60,60);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

function makeChecker(){
  const c = document.createElement('canvas'); c.width = 512; c.height = 64;
  const x = c.getContext('2d');
  for (let i=0;i<16;i++) for (let j=0;j<2;j++){
    x.fillStyle = ((i+j)%2) ? '#111' : '#f4f4f4';
    x.fillRect(i*32, j*32, 32, 32);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeWindowTex(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#000'; x.fillRect(0,0,128,256);
  for (let gy=0; gy<32; gy++) for (let gx=0; gx<8; gx++){
    if (Math.random() > 0.45){
      const hue = Math.random();
      const col = hue > 0.8 ? '#ffd9a0' : hue > 0.5 ? '#a8d8ff' : '#ffe9c0';
      x.globalAlpha = 0.35 + Math.random()*0.65;
      x.fillStyle = col;
      x.fillRect(gx*16+3, gy*8+2, 10, 4);
    }
  }
  x.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

function makeEnvTex(theme){
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0,0,0,256);
  g.addColorStop(0, theme.skyTop);
  g.addColorStop(0.46, theme.skyMid);
  g.addColorStop(0.54, theme.skyBottom);
  g.addColorStop(1, theme.night ? '#04050a' : '#3a3226');
  x.fillStyle = g; x.fillRect(0,0,512,256);
  const rg = x.createRadialGradient(150, 80, 0, 150, 80, 130);
  rg.addColorStop(0, theme.sunGlow);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = rg; x.fillRect(0,0,512,256);
  const t = new THREE.CanvasTexture(c);
  t.mapping = THREE.EquirectangularReflectionMapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

/* ============================================================
   TRACK BUILD
============================================================ */
let pts = [], tans = [], sampleSpacing = 1, trackLength = 0;
let trackCenter = new THREE.Vector2(), trackRadius = 100;

function buildTrack(def){
  const v3 = def.points.map(p => new THREE.Vector3(p[0], 0, p[1]));
  const curve = new THREE.CatmullRomCurve3(v3, true, 'catmullrom', 0.5);

  const raw = curve.getSpacedPoints(SAMPLES);
  pts = raw.slice(0, SAMPLES);
  trackLength = curve.getLength();
  sampleSpacing = trackLength / SAMPLES;

  tans = [];
  for (let i=0;i<SAMPLES;i++){
    const a = pts[(i-1+SAMPLES)%SAMPLES], b = pts[(i+1)%SAMPLES];
    tans.push(new THREE.Vector3(b.x-a.x, 0, b.z-a.z).normalize());
  }

  let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
  for (const p of pts){
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z);
  }
  trackCenter.set((minX+maxX)/2, (minZ+maxZ)/2);
  trackRadius = Math.max(maxX-minX, maxZ-minZ) * 0.5 + 40;
}

const _tp = new THREE.Vector3(), _tt = new THREE.Vector3();
function trackPoint(dist, lateral = 0){
  let f = ((dist / sampleSpacing) % SAMPLES + SAMPLES) % SAMPLES;
  const i0 = Math.floor(f), i1 = (i0+1)%SAMPLES, k = f - i0;
  _tp.copy(pts[i0]).lerp(pts[i1], k);
  _tt.copy(tans[i0]).lerp(tans[i1], k).normalize();
  _tp.x += -_tt.z * lateral;
  _tp.z +=  _tt.x * lateral;
  return _tp.clone();
}

function nearestSample(pos, hint){
  let best = 0, bestD = Infinity;
  if (hint === undefined){
    for (let i=0;i<SAMPLES;i++){
      const d = (pts[i].x-pos.x)**2 + (pts[i].z-pos.z)**2;
      if (d < bestD){ bestD = d; best = i; }
    }
  } else {
    for (let k=-70;k<=70;k++){
      const i = (hint + k + SAMPLES*2) % SAMPLES;
      const d = (pts[i].x-pos.x)**2 + (pts[i].z-pos.z)**2;
      if (d < bestD){ bestD = d; best = i; }
    }
  }
  return { idx: best, dist: Math.sqrt(bestD) };
}

/* ============================================================
   WORLD GEOMETRY
============================================================ */
function disposeGroup(g){
  g.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material){
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      ms.forEach(m => { for (const k in m) if (m[k] && m[k].isTexture) m[k].dispose(); m.dispose(); });
    }
  });
  g.clear();
}

function instanced(geo, mat, list, cast=true){
  const m = new THREE.InstancedMesh(geo, mat, list.length);
  const d = new THREE.Object3D();
  list.forEach((t,i)=>{
    d.position.copy(t.p);
    d.rotation.set(t.rx||0, t.ry||0, t.rz||0);
    d.scale.set(t.sx, t.sy, t.sz);
    d.updateMatrix();
    m.setMatrixAt(i, d.matrix);
  });
  m.castShadow = cast;
  m.receiveShadow = true;
  m.instanceMatrix.needsUpdate = true;
  worldGroup.add(m);
  return m;
}

function buildWorld(def){
  disposeGroup(worldGroup);
  const T = def.theme;

  const pmrem = new THREE.PMREMGenerator(renderer);
  const envSrc = makeEnvTex(T);
  const envRT = pmrem.fromEquirectangular(envSrc);
  scene.environment = envRT.texture;
  envSrc.dispose(); pmrem.dispose();

  skyMat.uniforms.top.value.set(T.skyTop);
  skyMat.uniforms.mid.value.set(T.skyMid);
  skyMat.uniforms.bot.value.set(T.skyBottom);

  scene.fog = new THREE.FogExp2(new THREE.Color(T.fog), T.fogDensity);
  sun.color.setHex(T.sunColor);
  sun.intensity = T.sunInt;
  sun.position.set(...T.sunPos);
  hemi.color.setHex(T.hemiSky);
  hemi.groundColor.setHex(T.hemiGround);
  hemi.intensity = T.hemiInt;
  renderer.toneMappingExposure = T.night ? 1.25 : 1.0;

  const groundMat = new THREE.MeshStandardMaterial({
    map: makeGroundTex('#'+new THREE.Color(T.ground).getHexString(),
                       T.night ? '60,70,110' : '255,255,255'),
    color: 0xffffff, roughness: 0.96, metalness: 0.0
  });
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.06;
  ground.receiveShadow = true;
  worldGroup.add(ground);

  const pos = [], uv = [], idx = [], nor = [];
  for (let i=0;i<=SAMPLES;i++){
    const j = i % SAMPLES;
    const p = pts[j], t = tans[j];
    const nx = -t.z, nz = t.x;
    const h = ROAD_W/2;
    pos.push(p.x + nx*h, 0, p.z + nz*h);
    pos.push(p.x - nx*h, 0, p.z - nz*h);
    nor.push(0,1,0, 0,1,0);
    const v = (i * sampleSpacing) / 10;
    uv.push(0, v, 1, v);
  }
  for (let i=0;i<SAMPLES;i++){
    const a = i*2, b = i*2+1, c = (i+1)*2, d = (i+1)*2+1;
    idx.push(a, b, c, b, d, c);
  }
  const roadGeo = new THREE.BufferGeometry();
  roadGeo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  roadGeo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  roadGeo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv,2));
  roadGeo.setIndex(idx);
  const asphalt = makeAsphalt();
  const roadMat = new THREE.MeshStandardMaterial({
    map: asphalt, roughness: 0.82, metalness: 0.03,
    color: T.night ? 0x9aa0b0 : 0xffffff
  });
  if (T.night){ roadMat.roughness = 0.45; roadMat.metalness = 0.25; }
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.receiveShadow = true;
  worldGroup.add(road);

  for (const side of [1,-1]){
    const kp = [], ki = [];
    for (let i=0;i<=SAMPLES;i++){
      const j = i % SAMPLES, p = pts[j], t = tans[j];
      const nx = -t.z, nz = t.x;
      const inner = side * (ROAD_W/2);
      const outer = side * (ROAD_W/2 + 1.1);
      kp.push(p.x + nx*inner, 0.005, p.z + nz*inner);
      kp.push(p.x + nx*outer, 0.005, p.z + nz*outer);
    }
    for (let i=0;i<SAMPLES;i++){
      const a=i*2, b=i*2+1, c=(i+1)*2, d=(i+1)*2+1;
      ki.push(a,b,c, b,d,c);
    }
    const kg = new THREE.BufferGeometry();
    kg.setAttribute('position', new THREE.Float32BufferAttribute(kp,3));
    kg.setAttribute('normal', new THREE.Float32BufferAttribute(
      new Array(kp.length/3).fill(0).flatMap(()=>[0,1,0]), 3));
    kg.setIndex(ki);
    const stripeCanvas = document.createElement('canvas');
    stripeCanvas.width = 8; stripeCanvas.height = 64;
    const sx = stripeCanvas.getContext('2d');
    for (let i=0;i<8;i++){
      sx.fillStyle = i%2 ? '#e8e8e8' : '#d02020';
      sx.fillRect(0, i*8, 8, 8);
    }
    const st = new THREE.CanvasTexture(stripeCanvas);
    st.wrapS = st.wrapT = THREE.RepeatWrapping;
    st.repeat.set(1, trackLength/4);
    st.colorSpace = THREE.SRGBColorSpace;
    const kuv = [];
    for (let i=0;i<=SAMPLES;i++){ const v = (i*sampleSpacing)/4; kuv.push(0,v, 1,v); }
    kg.setAttribute('uv', new THREE.Float32BufferAttribute(kuv,2));
    const kerb = new THREE.Mesh(kg, new THREE.MeshStandardMaterial({map:st, roughness:0.7}));
    kerb.receiveShadow = true;
    worldGroup.add(kerb);
  }

  const startGrp = new THREE.Group();
  startGrp.position.copy(pts[0]);
  startGrp.rotation.y = Math.atan2(tans[0].x, tans[0].z);
  const lineMesh = new THREE.Mesh(
    new THREE.PlaneGeometry(ROAD_W, 3),
    new THREE.MeshStandardMaterial({map: makeChecker(), roughness:0.75})
  );
  lineMesh.rotation.x = -Math.PI/2;
  lineMesh.position.y = 0.012;
  lineMesh.receiveShadow = true;
  startGrp.add(lineMesh);
  worldGroup.add(startGrp);

  buildScenery(T);
}

function buildScenery(T){
  const rnd = (a,b)=> a + Math.random()*(b-a);
  const near = (x,z,margin)=>{
    for (let i=0;i<SAMPLES;i+=24){
      const dx = pts[i].x-x, dz = pts[i].z-z;
      if (dx*dx+dz*dz < margin*margin) return true;
    }
    return false;
  };

  if (T.props === 'desert'){
    const rocks = [];
    for (let i=0;i<260;i++){
      const s = Math.floor(Math.random()*SAMPLES);
      const p = pts[s], t = tans[s];
      const side = Math.random()<0.5?1:-1;
      const off = side * rnd(ROAD_W/2+7, ROAD_W/2+70);
      const x = p.x + (-t.z)*off, z = p.z + (t.x)*off;
      if (near(x,z,ROAD_W/2+5)) continue;
      const sc = rnd(0.6, 3.6);
      rocks.push({ p:new THREE.Vector3(x, sc*0.32, z), rx:rnd(0,3), ry:rnd(0,6), rz:rnd(0,3),
                   sx:sc, sy:sc*rnd(0.5,0.9), sz:sc });
    }
    instanced(new THREE.IcosahedronGeometry(1, 0),
      new THREE.MeshStandardMaterial({color:0x9c7c58, roughness:0.95, flatShading:true}), rocks);

    const trunks = [], arms = [];
    for (let i=0;i<150;i++){
      const s = Math.floor(Math.random()*SAMPLES);
      const p = pts[s], t = tans[s];
      const side = Math.random()<0.5?1:-1;
      const off = side * rnd(ROAD_W/2+9, ROAD_W/2+90);
      const x = p.x + (-t.z)*off, z = p.z + (t.x)*off;
      if (near(x,z,ROAD_W/2+7)) continue;
      const h = rnd(3,7);
      trunks.push({ p:new THREE.Vector3(x, h/2, z), ry:rnd(0,6), sx:1, sy:h/3, sz:1 });
      if (Math.random()<0.7){
        arms.push({ p:new THREE.Vector3(x+rnd(-0.6,0.6), h*0.6, z+rnd(-0.6,0.6)),
                    rz:rnd(-0.6,0.6), sx:0.55, sy:1.1, sz:0.55 });
      }
    }
    const cactusMat = new THREE.MeshStandardMaterial({color:0x3f7a3a, roughness:0.85});
    instanced(new THREE.CylinderGeometry(0.42,0.5,3,7), cactusMat, trunks);
    if (arms.length) instanced(new THREE.CylinderGeometry(0.3,0.34,2.2,6), cactusMat, arms);

    const mesas = [];
    for (let i=0;i<18;i++){
      const a = Math.random()*Math.PI*2, r = rnd(600, 1100);
      const sc = rnd(60, 160);
      mesas.push({ p:new THREE.Vector3(trackCenter.x + Math.cos(a)*r, sc*0.35, trackCenter.y + Math.sin(a)*r),
                   ry:rnd(0,6), sx:sc*rnd(0.7,1.6), sy:sc*0.7, sz:sc*rnd(0.7,1.6) });
    }
    instanced(new THREE.CylinderGeometry(0.6, 1, 1, 8),
      new THREE.MeshStandardMaterial({color:0x8a5f42, roughness:1, flatShading:true}), mesas, false);
  }

  if (T.props === 'forest'){
    const trunks = [], foliage = [], foliage2 = [];
    for (let i=0;i<620;i++){
      const s = Math.floor(Math.random()*SAMPLES);
      const p = pts[s], t = tans[s];
      const side = Math.random()<0.5?1:-1;
      const off = side * rnd(ROAD_W/2+8, ROAD_W/2+160);
      const x = p.x + (-t.z)*off, z = p.z + (t.x)*off;
      if (near(x,z,ROAD_W/2+6)) continue;
      const h = rnd(7,17);
      trunks.push({ p:new THREE.Vector3(x, h*0.18, z), ry:rnd(0,6), sx:1, sy:h*0.36, sz:1 });
      foliage.push({ p:new THREE.Vector3(x, h*0.5, z), ry:rnd(0,6),
                     sx:rnd(1.6,2.6), sy:h*0.36, sz:rnd(1.6,2.6) });
      foliage2.push({ p:new THREE.Vector3(x, h*0.78, z), ry:rnd(0,6),
                      sx:rnd(1.0,1.7), sy:h*0.28, sz:rnd(1.0,1.7) });
    }
    instanced(new THREE.CylinderGeometry(0.28,0.4,1,6),
      new THREE.MeshStandardMaterial({color:0x3a2a1c, roughness:1}), trunks);
    const pineMat = new THREE.MeshStandardMaterial({color:0x1e4425, roughness:0.95, flatShading:true});
    instanced(new THREE.ConeGeometry(1, 1, 8), pineMat, foliage);
    instanced(new THREE.ConeGeometry(1, 1, 8),
      new THREE.MeshStandardMaterial({color:0x2a5c30, roughness:0.95, flatShading:true}), foliage2);

    const rocks = [];
    for (let i=0;i<120;i++){
      const s = Math.floor(Math.random()*SAMPLES);
      const p = pts[s], t = tans[s];
      const side = Math.random()<0.5?1:-1;
      const off = side * rnd(ROAD_W/2+10, ROAD_W/2+120);
      const x = p.x + (-t.z)*off, z = p.z + (t.x)*off;
      if (near(x,z,ROAD_W/2+7)) continue;
      const sc = rnd(0.8, 3);
      rocks.push({ p:new THREE.Vector3(x, sc*0.3, z), rx:rnd(0,3), ry:rnd(0,6),
                   sx:sc, sy:sc*0.65, sz:sc });
    }
    instanced(new THREE.DodecahedronGeometry(1, 0),
      new THREE.MeshStandardMaterial({color:0x6b6f70, roughness:1, flatShading:true}), rocks);
  }

  if (T.props === 'city'){
    const winTex = makeWindowTex();
    const bmat = new THREE.MeshStandardMaterial({
      color:0x1c2030, roughness:0.55, metalness:0.35,
      emissiveMap: winTex, emissive: 0xffffff, emissiveIntensity: 1.5
    });
    const buildings = [];
    for (let i=0;i<300;i++){
      const a = Math.random()*Math.PI*2, r = rnd(140, 900);
      const x = trackCenter.x + Math.cos(a)*r;
      const z = trackCenter.y + Math.sin(a)*r;
      if (near(x, z, 34)) continue;
      const w = rnd(16, 46), d = rnd(16, 46), h = rnd(18, 130);
      buildings.push({ p:new THREE.Vector3(x, h/2, z), ry:Math.round(rnd(0,6))*Math.PI/2,
                       sx:w, sy:h, sz:d });
    }
    instanced(new THREE.BoxGeometry(1,1,1), bmat, buildings, false);

    const poles = [], lamps = [];
    for (let i=0;i<SAMPLES;i+=Math.floor(SAMPLES/90)){
      const p = pts[i], t = tans[i];
      const side = (i % 2) ? 1 : -1;
      const off = side * (ROAD_W/2 + 2.2);
      const x = p.x + (-t.z)*off, z = p.z + (t.x)*off;
      poles.push({ p:new THREE.Vector3(x, 4.2, z), sx:1, sy:1, sz:1 });
      lamps.push({ p:new THREE.Vector3(x, 8.3, z), sx:1, sy:1, sz:1 });
    }
    instanced(new THREE.CylinderGeometry(0.13,0.2,8.4,6),
      new THREE.MeshStandardMaterial({color:0x2a2e38, roughness:0.6, metalness:0.7}), poles);
    instanced(new THREE.SphereGeometry(0.5, 10, 8),
      new THREE.MeshStandardMaterial({color:0xfff0c0, emissive:0xffd070, emissiveIntensity:4}), lamps, false);

    const neonColors = [0xff2a6d, 0x2ad4ff, 0xb02aff, 0xffe02a, 0x2aff8a];
    for (let i=0;i<26;i++){
      const a = Math.random()*Math.PI*2, r = rnd(180, 620);
      const x = trackCenter.x + Math.cos(a)*r, z = trackCenter.y + Math.sin(a)*r;
      const col = neonColors[Math.floor(Math.random()*neonColors.length)];
      const h = rnd(30, 90);
      const sign = new THREE.Mesh(
        new THREE.PlaneGeometry(rnd(6, 16), rnd(3, 8)),
        new THREE.MeshBasicMaterial({color: col, side: THREE.DoubleSide, toneMapped:false})
      );
      sign.position.set(x, h, z);
      sign.rotation.y = rnd(0, 6);
      worldGroup.add(sign);
    }
  }
}

function quadGeo(verts){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(verts.flat(), 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute([0,0, 1,0, 1,1, 0,1], 2));
  g.setIndex([0,1,2, 0,2,3]);
  g.computeVertexNormals();
  return g;
}

  const fw_r = WHEEL_R * 1.28;
  const tireGeo = new THREE.CylinderGeometry(fw_r, fw_r, 0.38, 24);
  tireGeo.rotateZ(Math.PI/2);
  const rimGeo = new THREE.CylinderGeometry(fw_r*0.60, fw_r*0.60, 0.40, 14);
  rimGeo.rotateZ(Math.PI/2);
  const spokeGeo = new THREE.BoxGeometry(0.42, fw_r*1.15, 0.05);

  const wheels = [];
  const wz = def.wheelbase/2;
  const wx = W/2 - 0.02;
  for (const [sx, sz] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
    const pivot = new THREE.Group();
    pivot.position.set(sx*wx, fw_r, sz*wz);

    const spin = new THREE.Group();
    const tire = new THREE.Mesh(tireGeo, rubber);
    tire.castShadow = true;
    spin.add(tire);
    spin.add(new THREE.Mesh(rimGeo, rimMat));
    for (let k=0;k<5;k++){
      const sp = new THREE.Mesh(spokeGeo, rimMat);
      sp.rotation.x = k * Math.PI/5;
      spin.add(sp);
    }
    pivot.add(spin);
    g.add(pivot);
    wheels.push({ pivot, spin, front: sz > 0 });

    const armGeo = new THREE.BoxGeometry(W*0.42, 0.045, 0.09);
    for (const yy of [fw_r*0.55, fw_r*1.05]){
      const arm = new THREE.Mesh(armGeo, carbon);
      arm.position.set(sx*W*0.34, yy, sz*wz);
      g.add(arm);
    }
    const upright = new THREE.Mesh(new THREE.BoxGeometry(0.10, fw_r*1.1, 0.10), carbon);
    upright.position.set(sx*wx*0.85, fw_r, sz*wz);
    g.add(upright);
  }

  g.userData.wheels   = wheels;
  g.userData.tailMats = [tailM];
  g.userData.wheelR   = fw_r;
  return g;
}

/* ============================================================
   STANDARD ROAD CAR MESH
============================================================ */
function buildCarMesh(def, colorHex){
  if (def.type === 'f1') return buildF1Mesh(def, colorHex);

  const g = new THREE.Group();
  const L = def.length, W = def.width, hw = L/2;

  const paint = new THREE.MeshStandardMaterial({ color: colorHex, metalness:0.72, roughness:0.28, envMapIntensity:1.3 });
  const glass = new THREE.MeshStandardMaterial({ color:0x0a0e15, metalness:0.55, roughness:0.05,
    side:THREE.DoubleSide, envMapIntensity:1.8,
    polygonOffset:true, polygonOffsetFactor:-3, polygonOffsetUnits:-3 });
  const rubber = new THREE.MeshStandardMaterial({ color:0x101012, roughness:0.92, metalness:0.0 });
  const rimMat = new THREE.MeshStandardMaterial({ color:0xc4c9d2, metalness:1.0, roughness:0.24 });
  const dark   = new THREE.MeshStandardMaterial({ color:0x14161b, roughness:0.55, metalness:0.5 });
  const lightM = new THREE.MeshStandardMaterial({ color:0xffffff, emissive:0xfff0cc, emissiveIntensity:2.2, roughness:0.15 });
  const tailM  = new THREE.MeshStandardMaterial({ color:0x2a0000, emissive:0xff1400, emissiveIntensity:1.3, roughness:0.3 });

  const prof = [
    [-hw, 0.28],[-hw, 0.74],[-hw*0.72, 0.94],[-hw*0.45, 1.30],[hw*0.18, 1.32],
    [ hw*0.52, 0.94],[ hw, 0.80],[ hw, 0.34],[ hw*0.76, 0.22],[-hw*0.76, 0.22]
  ];
  const shape = new THREE.Shape();
  shape.moveTo(prof[0][0], prof[0][1]);
  for (let i=1;i<prof.length;i++) shape.lineTo(prof[i][0], prof[i][1]);
  shape.closePath();

  const bt = 0.07, bs = 0.06;
  const bodyGeo = new THREE.ExtrudeGeometry(shape, {
    depth: W - 2*bt, bevelEnabled:true, bevelThickness:bt, bevelSize:bs,
    bevelSegments:3, curveSegments:5
  });
  bodyGeo.translate(0, 0, -(W - 2*bt)/2);
  bodyGeo.rotateY(-Math.PI/2);
  bodyGeo.computeVertexNormals();
  const body = new THREE.Mesh(bodyGeo, paint);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  const winShape = new THREE.Shape();
  const wp = [[-hw*0.60, 0.90],[-hw*0.38, 1.24],[ hw*0.10, 1.26],[ hw*0.44, 0.92]];
  winShape.moveTo(wp[0][0], wp[0][1]);
  for (let i=1;i<wp.length;i++) winShape.lineTo(wp[i][0], wp[i][1]);
  winShape.closePath();
  const winGeo = new THREE.ShapeGeometry(winShape);
  winGeo.rotateY(-Math.PI/2);
  for (const s of [1,-1]){
    const w = new THREE.Mesh(winGeo, glass);
    w.position.x = s * (W/2 - 0.06);
    if (s < 0) w.rotation.y = Math.PI;
    g.add(w);
  }

  const wsW = W*0.44;
  const wind = new THREE.Mesh(quadGeo([
    [-wsW, 0.98, hw*0.52],[ wsW, 0.98, hw*0.52],
    [ wsW, 1.34, hw*0.18],[-wsW, 1.34, hw*0.18]
  ]), glass);
  g.add(wind);
  const rear = new THREE.Mesh(quadGeo([
    [-wsW, 1.32, -hw*0.45],[ wsW, 1.32, -hw*0.45],
    [ wsW, 0.96, -hw*0.74],[-wsW, 0.96, -hw*0.74]
  ]), glass);
  g.add(rear);

  const tireGeo = new THREE.CylinderGeometry(WHEEL_R, WHEEL_R, 0.26, 22);
  tireGeo.rotateZ(Math.PI/2);
  const rimGeo = new THREE.CylinderGeometry(WHEEL_R*0.62, WHEEL_R*0.62, 0.28, 14);
  rimGeo.rotateZ(Math.PI/2);
  const spokeGeo = new THREE.BoxGeometry(0.30, WHEEL_R*1.15, 0.06);

  const wheels = [];
  const wz = def.wheelbase/2, wx = W/2 - 0.05;
  for (const [sx, sz] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
    const pivot = new THREE.Group();
    pivot.position.set(sx*wx, WHEEL_R, sz*wz);

    const spin = new THREE.Group();
    const tire = new THREE.Mesh(tireGeo, rubber);
    tire.castShadow = true;
    spin.add(tire);
    const rim = new THREE.Mesh(rimGeo, rimMat);
    spin.add(rim);
    for (let k=0;k<5;k++){
      const sp = new THREE.Mesh(spokeGeo, rimMat);
      sp.rotation.x = k * Math.PI/5;
      spin.add(sp);
    }
    pivot.add(spin);
    g.add(pivot);
    wheels.push({ pivot, spin, front: sz > 0 });
  }

  const hl = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.13, 0.10), lightM);
  hl.position.set( W*0.28, 0.84, hw - 0.04); g.add(hl);
  const hl2 = hl.clone(); hl2.position.x = -W*0.28; g.add(hl2);

  const tl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.11, 0.09), tailM);
  tl.position.set( W*0.28, 0.86, -hw + 0.03); g.add(tl);
  const tl2 = tl.clone(); tl2.position.x = -W*0.28; g.add(tl2);

  if (def.spoiler){
    const wing = new THREE.Mesh(new THREE.BoxGeometry(W*0.86, 0.06, 0.36), dark);
    wing.position.set(0, 1.12, -hw + 0.22);
    wing.castShadow = true;
    g.add(wing);
    const supGeo = new THREE.BoxGeometry(0.07, 0.30, 0.12);
    for (const s of [1,-1]){
      const sup = new THREE.Mesh(supGeo, dark);
      sup.position.set(s*W*0.32, 0.98, -hw + 0.20);
      g.add(sup);
    }
  }

  const splitter = new THREE.Mesh(new THREE.BoxGeometry(W*0.94, 0.05, 0.5), dark);
  splitter.position.set(0, 0.20, hw - 0.18);
  g.add(splitter);

  g.userData.wheels   = wheels;
  g.userData.tailMats = [tailM];
  g.userData.wheelR   = WHEEL_R;
  return g;
}

let racers = [];
let player = null;

function createRacer(carDef, colorHex, isPlayer){
  const mesh = buildCarMesh(carDef, colorHex);
  racersGroup.add(mesh);
  return {
    def: carDef, mesh, isPlayer,
    pos: new THREE.Vector3(), heading: 0,
    vel: new THREE.Vector3(),
    vLong: 0, vLat: 0,
    steerVis: 0, wheelSpin: 0,
    idx: 0, lap: 1, lapTime: 0, bestLap: null, totalTime: 0,
    finished: false, finishTime: 0,
    lineOffset: 0, skill: 1,
    inputs: { throttle:0, brake:0, steer:0, handbrake:false }
  };
}

function spawnRacers(){
  racersGroup.clear();
  racers = [];

  const gridDefs = [
    { d: 10, off: -3.2 }, { d: 20, off: 3.2 },
    { d: 30, off: -3.2 }, { d: 40, off: 3.2 }
  ];

  const p = createRacer(CARS[selectedCar], CARS[selectedCar].color, true);
  const gp = gridDefs[0];
  const startP = trackPoint(gp.d * sampleSpacing, gp.off);
  p.pos.copy(startP);
  p.heading = Math.atan2(tans[gp.d % SAMPLES].x, tans[gp.d % SAMPLES].z);
  p.idx = gp.d;
  p.lap = 1;
  racers.push(p);
  player = p;

  // shuffled AI opponents
  const others = CARS.map((c,i)=>i)
    .filter(i => i !== selectedCar)
    .sort(() => Math.random() - 0.5);

  for (let i=0;i<3;i++){
    const defIdx = others[i % others.length];
    const def = CARS[defIdx];
    const ai = createRacer(def, def.color, false);
    const g = gridDefs[i+1];
    const sp = trackPoint(g.d * sampleSpacing, g.off);
    ai.pos.copy(sp);
    ai.heading = Math.atan2(tans[g.d % SAMPLES].x, tans[g.d % SAMPLES].z);
    ai.idx = g.d;
    ai.lineOffset = (Math.random()-0.5) * 4;
    ai.skill = 0.82 + Math.random()*0.16;
    racers.push(ai);
  }

  for (const r of racers){
    r.mesh.position.copy(r.pos);
    r.mesh.rotation.y = r.heading;
  }
}

/* ============================================================
   PHYSICS
============================================================ */
const _fwd = new THREE.Vector3(), _right = new THREE.Vector3();

function updatePhysics(r, dt){
  const def = r.def;
  const info = nearestSample(r.pos, r.idx);

  const prev = r.idx;
  r.idx = info.idx;
  if (prev > SAMPLES*0.85 && r.idx < SAMPLES*0.15){
    if (r.lap >= 1 && !r.finished){
      if (r.bestLap === null || r.lapTime < r.bestLap) r.bestLap = r.lapTime;
      r.lap++;
      r.lapTime = 0;
      if (r.lap > TOTAL_LAPS){
        r.finished = true;
        r.finishTime = r.totalTime;
      }
    }
  } else if (prev < SAMPLES*0.15 && r.idx > SAMPLES*0.85){
    if (r.lap > 1) r.lap--;
  }

  if (r.finished) r.inputs = { throttle:0.35, brake:0, steer:0, handbrake:false };

  const onRoad = info.dist < ROAD_W*0.5 + 1.0;

  _fwd.set(Math.sin(r.heading), 0, Math.cos(r.heading));
  _right.set(Math.cos(r.heading), 0, -Math.sin(r.heading));

  let vLong = r.vel.dot(_fwd);
  let vLat  = r.vel.dot(_right);
  const speed = Math.abs(vLong);

  let a = 0;
  const th = r.inputs.throttle, br = r.inputs.brake;

  if (th > 0){
    const ratio = Math.min(1, speed / def.topSpeed);
    a += th * def.accel * (1 - ratio*ratio);
  }
  if (br > 0){
    if (vLong > 0.6) a -= br * def.brake;
    else a -= br * def.accel * 0.55;
  }
  if (th === 0 && br === 0 && speed < 0.4) vLong *= 0.85;

  // reduced drag so top speeds are reachable
  a -= vLong * 0.032;
  a -= Math.sign(vLong) * 0.9;

  if (!onRoad) a -= vLong * 1.35;

  vLong += a * dt;
  vLong = Math.max(-def.topSpeed*0.32, Math.min(def.topSpeed*1.02, vLong));

  const speedFactor = 1 / (1 + Math.abs(vLong) * 0.28);
  const steerAngle = r.inputs.steer * def.steer * speedFactor;
  const omega = (vLong / def.wheelbase) * Math.tan(steerAngle);
  r.steerVis += ((r.inputs.steer * 0.55) - r.steerVis) * Math.min(1, dt*10);

  let grip = def.grip * (onRoad ? 1 : 0.42);
  if (r.inputs.handbrake) grip *= 0.22;
  vLat *= Math.exp(-grip * dt);

  r.vel.copy(_fwd).multiplyScalar(vLong).addScaledVector(_right, vLat);

  r.heading += omega * dt;

  r.pos.addScaledVector(r.vel, dt);
  r.pos.y = 0;

  if (!r.finished){
    r.lapTime += dt;
    r.totalTime += dt;
  }

  r.mesh.position.copy(r.pos);
  r.mesh.rotation.y = r.heading;

  const wheels = r.mesh.userData.wheels;
  const wr = r.mesh.userData.wheelR || WHEEL_R;
  r.wheelSpin += (vLong / wr) * dt;
  for (const w of wheels){
    w.spin.rotation.x = r.wheelSpin;
    if (w.front) w.pivot.rotation.y = r.steerVis;
  }

  const braking = (r.inputs.brake > 0.05 && vLong > 0.5) || r.inputs.handbrake;
  for (const m of r.mesh.userData.tailMats){
    m.emissiveIntensity = braking ? 6.0 : 1.2;
  }
}

/* ============================================================
   AI
============================================================ */
function updateAI(r, dt){
  const dist = r.idx * sampleSpacing;
  const speed = r.vel.length();

  const look = 9 + speed * 0.42;
  const target = trackPoint(dist + look, r.lineOffset);

  _fwd.set(Math.sin(r.heading), 0, Math.cos(r.heading));
  _right.set(Math.cos(r.heading), 0, -Math.sin(r.heading));

  const tx = target.x - r.pos.x, tz = target.z - r.pos.z;
  const lx = tx*_right.x + tz*_right.z;
  const lz = tx*_fwd.x   + tz*_fwd.z;

  let steer = Math.atan2(lx, Math.max(lz, 1)) * 2.4;
  steer = Math.max(-1, Math.min(1, steer));

  const a1 = trackPoint(dist + 22, 0);
  const b1 = trackPoint(dist + 44, 0);
  const c1 = trackPoint(dist + 66, 0);
  const v1x = b1.x-a1.x, v1z = b1.z-a1.z;
  const v2x = c1.x-b1.x, v2z = c1.z-b1.z;
  const l1 = Math.hypot(v1x,v1z) || 1, l2 = Math.hypot(v2x,v2z) || 1;
  let dot = (v1x*v2x + v1z*v2z) / (l1*l2);
  dot = Math.max(-1, Math.min(1, dot));
  const curvature = Math.acos(dot) / 22;

  const maxLat = 13 * (r.def.grip / 9);
  let targetSpeed = curvature > 0.0008 ? Math.sqrt(maxLat / curvature) : r.def.topSpeed;
  targetSpeed = Math.min(targetSpeed, r.def.topSpeed) * r.skill;

  r.inputs.steer = steer;
  r.inputs.throttle = speed < targetSpeed ? 1 : 0;
  r.inputs.brake = speed > targetSpeed * 1.14 ? 0.9 : 0;
  r.inputs.handbrake = false;
}

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyR' && player) resetCar();
});
addEventListener('keyup', e => { keys[e.code] = false; });

let touchInput = { steer:0, throttle:0, brake:0 };
function bindTouch(){
  if (!('ontouchstart' in window)) return;
  document.getElementById('touch').classList.add('show');
  const bind = (id, on, off) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); on(); }, {passive:false});
    el.addEventListener('touchend',   e => { e.preventDefault(); off(); }, {passive:false});
    el.addEventListener('touchcancel',e => { off(); });
  };
  bind('tL', ()=> touchInput.steer = -1, ()=> touchInput.steer = 0);
  bind('tR', ()=> touchInput.steer =  1, ()=> touchInput.steer = 0);
  bind('tA', ()=> touchInput.throttle = 1, ()=> touchInput.throttle = 0);
  bind('tB', ()=> touchInput.brake = 1,   ()=> touchInput.brake = 0);
}
bindTouch();

function readPlayerInput(){
  if (state !== 'racing' || player.finished){
    return { throttle:0, brake:0, steer:0, handbrake:false };
  }
  const up   = keys['KeyW'] || keys['ArrowUp'];
  const down = keys['KeyS'] || keys['ArrowDown'];
  const left = keys['KeyA'] || keys['ArrowLeft'];
  const right= keys['KeyD'] || keys['ArrowRight'];
  return {
    throttle: up ? 1 : touchInput.throttle,
    brake:    down ? 1 : touchInput.brake,
    steer:    (left ? -1 : 0) + (right ? 1 : 0) + touchInput.steer,
    handbrake: !!keys['Space']
  };
}

function resetCar(){
  if (!player) return;
  const p = trackPoint(player.idx * sampleSpacing, 0);
  player.pos.copy(p);
  player.vel.set(0,0,0);
  player.heading = Math.atan2(tans[player.idx % SAMPLES].x, tans[player.idx % SAMPLES].z);
  player.mesh.position.copy(player.pos);
  player.mesh.rotation.y = player.heading;
}

/* ============================================================
   CAMERA
============================================================ */
const camPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
let camInit = false;
let sunOffset = new THREE.Vector3(-260, 140, 180);

function updateCamera(dt){
  if (!player) return;
  const speed = player.vel.length();
  const h = player.heading;

  const back = 7.4 + speed * 0.075;
  const up   = 3.15 + speed * 0.014;

  const dx = -Math.sin(h), dz = -Math.cos(h);
  const desired = new THREE.Vector3(
    player.pos.x + dx*back,
    up,
    player.pos.z + dz*back
  );

  if (!camInit){ camPos.copy(desired); camInit = true; }

  const lerpRate = 1 - Math.exp(-7 * dt);
  camPos.lerp(desired, lerpRate);

  const lookAhead = 6 + speed * 0.18;
  const lookTarget = new THREE.Vector3(
    player.pos.x + Math.sin(h) * lookAhead,
    1.3,
    player.pos.z + Math.cos(h) * lookAhead
  );
  camLook.lerp(lookTarget, 1 - Math.exp(-10 * dt));

  camera.position.copy(camPos);
  camera.lookAt(camLook);

  const targetFov = 62 + Math.min(speed * 0.28, 20);
  camera.fov += (targetFov - camera.fov) * Math.min(1, dt*4);
  camera.updateProjectionMatrix();

  sun.position.set(
    player.pos.x + sunOffset.x,
    sunOffset.y,
    player.pos.z + sunOffset.z
  );
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();

  skyDome.position.copy(camera.position);
}

/* ============================================================
   MINIMAP
============================================================ */
const mmCanvas = document.getElementById('minimap');
const mmCtx = mmCanvas.getContext('2d');

function drawMinimap(){
  const c = mmCanvas, x = mmCtx;
  x.clearRect(0,0,c.width,c.height);
  if (!pts.length) return;

  const scale = Math.min(c.width, c.height) / (trackRadius * 2.35);

  x.save();
  x.translate(c.width/2, c.height/2);
  x.scale(scale, scale);
  x.translate(-trackCenter.x, -trackCenter.y);

  x.beginPath();
  for (let i=0;i<=SAMPLES;i+=8){
    const p = pts[i % SAMPLES];
    if (i === 0) x.moveTo(p.x, p.z); else x.lineTo(p.x, p.z);
  }
  x.closePath();
  x.lineJoin = 'round';
  x.lineCap = 'round';
  x.strokeStyle = 'rgba(255,255,255,0.16)';
  x.lineWidth = ROAD_W * 1.35;
  x.stroke();
  x.strokeStyle = 'rgba(255,255,255,0.62)';
  x.lineWidth = ROAD_W * 0.55;
  x.stroke();

  x.beginPath();
  x.arc(pts[0].x, pts[0].z, 9/scale*0.6, 0, 7);
  x.fillStyle = '#ffffff';
  x.fill();

  for (const r of racers){
    x.beginPath();
    x.arc(r.pos.x, r.pos.z, 8/scale, 0, 7);
    x.fillStyle = r.isPlayer ? '#ff8a3c' : 'rgba(255,255,255,0.85)';
    x.fill();
    if (r.isPlayer){
      x.lineWidth = 2/scale;
      x.strokeStyle = '#fff';
      x.stroke();
    }
  }
  x.restore();
}

function startRace(){
  loadingEl.classList.add('show');
  menuEl.classList.remove('show');
  resultsEl.classList.remove('show');
  hudEl.classList.remove('show');

  setTimeout(() => {
    const def = TRACKS[selectedTrack];
    buildTrack(def);
    buildWorld(def);
    sunOffset.set(...def.theme.sunPos);
    spawnRacers();

    camInit = false;
    state = 'countdown';

    cdEl.classList.add('show');
    cdEl.style.color = '#fff';
    cdEl.textContent = '3';

    loadingEl.classList.remove('show');
    hudEl.classList.add('show');
    document.getElementById('lapTot').textContent = TOTAL_LAPS;
  }, 60);
}

document.getElementById('startBtn').onclick = startRace;
document.getElementById('againBtn').onclick = startRace;
document.getElementById('menuBtn').onclick = () => {
  resultsEl.classList.remove('show');
  hudEl.classList.remove('show');
  menuEl.classList.add('show');
  state = 'menu';
};

function showResults(){
  const order = [...racers].sort((a,b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return (b.lap*10000 + b.idx) - (a.lap*10000 + a.idx);
  });
  const pos = order.indexOf(player) + 1;

  document.getElementById('resTitle').textContent =
    pos === 1 ? '🏆 VICTORY' : `FINISHED ${ordinal(pos)}`;

  const rows = document.getElementById('resRows');
  rows.innerHTML = '';
  const add = (k, v) => {
    const d = document.createElement('div');
    d.className = 'row';
    d.innerHTML = `<span style="opacity:.6">${k}</span><b>${v}</b>`;
    rows.appendChild(d);
  };
  add('POSITION', `${ordinal(pos)} of ${racers.length}`);
  add('TOTAL TIME', fmt(player.totalTime));
  add('BEST LAP', player.bestLap ? fmt(player.bestLap) : '—');
  add('CAR', player.def.name);
  add('CIRCUIT', TRACKS[selectedTrack].name);

  resultsEl.classList.add('show');
}

const ordinal = n => n + (['th','st','nd','rd'][(n%100-20)%10] || ['th','st','nd','rd'][n%100] || 'th');
function fmt(t){
  const m = Math.floor(t/60);
  const s = t % 60;
  return `${m}:${s.toFixed(2).padStart(5,'0')}`;
}

/* ============================================================
   MAIN LOOP
============================================================ */
let last = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  let dt = (now - last) / 1000;
  last = now;
  dt = Math.min(dt, 0.05);

  if (state === 'countdown'){
    countdown -= dt;
    if (countdown > 2.9)      cdEl.textContent = '3';
    else if (countdown > 1.9) cdEl.textContent = '2';
    else if (countdown > 0.9) cdEl.textContent = '1';
    else if (countdown > 0){
      cdEl.textContent = 'GO!';
      cdEl.style.color = '#8dff6a';
      state = 'racing';
      setTimeout(() => cdEl.classList.remove('show'), 700);
    }
    for (const r of racers) updatePhysics(r, dt);
  }
  else if (state === 'racing'){
    player.inputs = readPlayerInput();
    for (const r of racers){
      if (!r.isPlayer && !r.finished) updateAI(r, dt);
      updatePhysics(r, dt);
    }
    if (player.finished && !resultsEl.classList.contains('show')){
      if (!player._resultShown){ player._resultShown = true; setTimeout(showResults, 900); }
    }
  }

  if (state === 'racing' || state === 'countdown'){
    updateCamera(dt);
    updateHUD();
    drawMinimap();
  } else if (state === 'menu'){
    camera.position.set(Math.sin(now*0.00015)*160, 70, Math.cos(now*0.00015)*160);
    camera.lookAt(0, 4, 0);
  }

  renderer.render(scene, camera);
}

function updateHUD(){
  if (!player) return;
  const kmh = Math.round(player.vel.length() * 3.6);
  document.getElementById('speedVal').textContent = kmh;
  document.getElementById('lapNum').textContent = Math.min(player.lap, TOTAL_LAPS);
  document.getElementById('curTime').textContent = fmt(player.lapTime);
  document.getElementById('bestTime').textContent = player.bestLap ? fmt(player.bestLap) : '--:--.--';

  const order = [...racers].sort((a,b) => {
    if (a.finished && b.finished) return a.finishTime - b.finishTime;
    if (a.finished) return -1;
    if (b.finished) return 1;
    return (b.lap*100000 + b.idx) - (a.lap*100000 + a.idx);
  });
  const p = order.indexOf(player) + 1;
  document.getElementById('posText').textContent = ordinal(p);
  document.getElementById('ofText').textContent = 'OF ' + racers.length;
}

/* ============================================================
   RESIZE
============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   BOOT
============================================================ */
(function preview(){
  buildTrack(TRACKS[0]);
  buildWorld(TRACKS[0]);
})();

requestAnimationFrame(loop);
</script>
